        body {
            background: #0f1117;

            padding: 24px;

        .header {
            text-align: center;

            padding-bottom: 20px;

        }
        .header h1 {

            font-weight: 700;

            color: #888;

        .card {

            justify-content: space-between;
            align-items: flex-start;
            margin-bottom: 8px;
        }
        .card .name {
            font-size: 15px;
            font-weight: 600;
            color: #fff;
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .card .name .emoji { font-size: 16px; }
        .card .unit {
            font-size: 11px;
            color: #666;
            margin-top: 2px;
        }
        .card .price {
            font-size: 22px;
            font-weight: 700;
            color: #fff;
            margin-bottom: 6px;
        }
        .card .changes {
            display: flex;
            gap: 14px;
            align-items: center;
            flex-wrap: wrap;
        }
        .card .change-badge {
            font-size: 13px;
            font-weight: 600;
            padding: 3px 8px;
            border-radius: 6px;
        }
        .card .change-badge.up {
            background: rgba(34, 197, 94, 0.15);
            color: #22c55e;
        }
        .card .change-badge.down {
            background: rgba(239, 68, 68, 0.15);
            color: #ef4444;
        }
        .card .change-badge.flat {
            background: rgba(160, 160, 160, 0.15);
            color: #999;
        }
        .card .monthly {
            font-size: 12px;
            color: #888;
        }
        .card .monthly .val {
            font-weight: 600;
        }
        .card .monthly .val.up { color: #22c55e; }
        .card .monthly .val.down { color: #ef4444; }
        .card .monthly .val.flat { color: #999; }

        .card .comment {
            font-size: 12px;
            color: #667;
            margin-top: 10px;
            line-height: 1.5;
            border-top: 1px solid #252830;
            padding-top: 8px;
        }

        .summary-bar {
            display: flex;
            gap: 12px;
            flex-wrap: wrap;
            justify-content: center;
            margin-bottom: 28px;
        }
        .summary-chip {
            background: #1a1d27;
            border: 1px solid #2a2d35;
            border-radius: 10px;
            padding: 12px 20px;
            text-align: center;
            min-width: 140px;
        }
        .summary-chip .label {
            font-size: 12px;
            color: #888;
            margin-bottom: 4px;
        }
        .summary-chip .value {

            font-weight: 700;

            .grid { grid-template-columns: 1fr; }

function formatPrice(price) {
    if (price >= 100000) return price.toLocaleString('ko-KR', { maximumFractionDigits: 0 });
    if (price >= 1000) return price.toLocaleString('ko-KR', { maximumFractionDigits: 2 });
    if (price >= 100) return price.toLocaleString('ko-KR', { maximumFractionDigits: 2 });
    if (price >= 10) return price.toLocaleString('ko-KR', { maximumFractionDigits: 4 });
    return price.toLocaleString('ko-KR', { maximumFractionDigits: 4 });
}

function cls(val) {
    if (val > 0) return 'up';
    if (val < 0) return 'down';
    return 'flat';
}

function sign(val) {
    if (val > 0) return '+';
    return '';
}

let allItems = sections.flatMap(s => s.items);
let upCount = allItems.filter(i => i.changePct > 0).length;
let downCount = allItems.filter(i => i.changePct < 0).length;

let sorted = [...allItems].sort((a, b) => b.monthly - a.monthly);
let best = sorted[0];
let worst = sorted[sorted.length - 1];

document.getElementById('up-count').textContent = upCount + '개';
document.getElementById('down-count').textContent = downCount + '개';
document.getElementById('best-monthly').textContent = best.name + ' ' + sign(best.monthly) + best.monthly + '%';
document.getElementById('worst-monthly').textContent = worst.name + ' ' + worst.monthly + '%';

let dashboard = document.getElementById('dashboard');

sections.forEach(section => {
    let sectionEl = document.createElement('div');
    sectionEl.className = 'section';

    sectionEl.innerHTML = `<div class="section-title"><span class="icon">${section.icon}</span> ${section.title}</div>`;

    let grid = document.createElement('div');
    grid.className = 'grid';

    section.items.forEach(item => {
        let card = document.createElement('div');
        card.className = 'card';
        card.innerHTML = `
            <div class="top-row">
                <div>
                    <div class="name"><span class="emoji">${item.emoji}</span> ${item.name}</div>
                    <div class="unit">${item.unit}</div>
                </div>
            </div>
            <div class="price">${formatPrice(item.price)}</div>
            <div class="changes">
                <span class="change-badge ${cls(item.changePct)}">
                    ${sign(item.changePct)}${item.changePct.toFixed(2)}%
                </span>
                <span class="monthly">월간 <span class="val ${cls(item.monthly)}">${sign(item.monthly)}${item.monthly.toFixed(2)}%</span></span>
            </div>
            <div class="comment">${item.comment}</div>
        `;
        grid.appendChild(card);
    });

    sectionEl.appendChild(grid);
    dashboard.appendChild(sectionEl);
});
